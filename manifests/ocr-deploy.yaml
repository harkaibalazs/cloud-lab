apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  labels:
    app: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr
  template:
    metadata:
      labels:
        app: ocr
    spec:
      containers:
        - name: ocr
          image: ghcr.io/harkaibalazs/ocr:latest
          env:
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/%2F
            - name: RABBITMQ_EXCHANGE
              value: events
            - name: RABBITMQ_QUEUE
              value: ocr_worker
            - name: REDIS_URL
              value: redis://redis:6379/0
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
